spring.application.name=backend-reservas-hoteleria-test

# Base de datos H2 en memoria: las pruebas no dependen de PostgreSQL ni de variables externas.
spring.datasource.url=jdbc:h2:mem:reservas_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.profiles.active=test

